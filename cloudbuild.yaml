steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.clawman'
      - '-t'
      - 'us-central1-docker.pkg.dev/fooo-gcp/clawman/clawman:latest'
      - '.'
    timeout: '1200s'

images:
  - 'us-central1-docker.pkg.dev/fooo-gcp/clawman/clawman:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
